# eksctl create cluster -f eksctl/cluster.yaml
# trocar 123456789012 pelo id da conta
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: togglemaster
  region: us-east-1
  version: "1.31"

vpc:
  nat:
    gateway: Single

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent

managedNodeGroups:
  - name: default
    instanceType: t3.medium
    minSize: 1
    desiredCapacity: 2
    maxSize: 4
    privateNetworking: true

iam:
  podIdentityAssociations:
    - namespace: tm-evaluation
      serviceAccountName: evaluation-service
      createServiceAccount: false
      permissionPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ["sqs:SendMessage", "sqs:GetQueueUrl"]
            Resource: arn:aws:sqs:us-east-1:123456789012:togglemaster-events

    - namespace: tm-analytics
      serviceAccountName: analytics-service
      createServiceAccount: false
      permissionPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes", "sqs:GetQueueUrl"]
            Resource: arn:aws:sqs:us-east-1:123456789012:togglemaster-events
          - Effect: Allow
            Action: ["dynamodb:PutItem", "dynamodb:DescribeTable"]
            Resource: arn:aws:dynamodb:us-east-1:123456789012:table/ToggleMasterAnalytics

    - namespace: keda
      serviceAccountName: keda-operator
      createServiceAccount: false
      permissionPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ["sqs:GetQueueAttributes"]
            Resource: arn:aws:sqs:us-east-1:123456789012:togglemaster-events
