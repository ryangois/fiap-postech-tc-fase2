# um ingress por namespace, o nginx junta tudo no mesmo lb
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flag-service
  namespace: tm-flag
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /flags
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  number: 8002
