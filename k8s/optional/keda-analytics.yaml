# opção b: escala o analytics pela fila (fora do kustomization)
# antes: kubectl delete hpa analytics-service -n tm-analytics
# trocar queueURL pela url da fila
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: aws-sqs-auth
  namespace: tm-analytics
spec:
  podIdentity:
    provider: aws
    # usa a role do operador do keda
    identityOwner: keda
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service
  namespace: tm-analytics
spec:
  scaleTargetRef:
    name: analytics-service
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: aws-sqs-auth
      metadata:
        queueURL: https://sqs.us-east-1.amazonaws.com/123456789012/togglemaster-events
        awsRegion: us-east-1
        queueLength: "20"   # msgs por pod
