# aplica o db/init.sql no rds
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-db-init
  namespace: tm-auth
  labels:
    app: auth-service-db-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: auth-service-db-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        # pega o init.sql da imagem do serviço
        - name: copy-schema
          image: auth-service
          command: ["cp", "/app/db/init.sql", "/sql/init.sql"]
          securityContext:
            runAsUser: 10001
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: sql
              mountPath: /sql
      containers:
        - name: psql
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: auth-service-secret
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -d "$DATABASE_URL"; do echo "aguardando RDS..."; sleep 3; done
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/init.sql
              # chave do evaluation-service
              echo "INSERT INTO api_keys (name, key_hash) VALUES ('evaluation-service', encode(sha256(convert_to(:'key', 'UTF8')), 'hex')) ON CONFLICT (key_hash) DO NOTHING;" \
                | psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v key="$SERVICE_API_KEY"
              echo "schema aplicado"
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          emptyDir: {}
