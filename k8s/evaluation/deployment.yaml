apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: tm-evaluation
  labels:
    app: evaluation-service
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: evaluation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: evaluation-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      serviceAccountName: evaluation-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: evaluation-service
          image: evaluation-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-service-config
            - secretRef:
                name: evaluation-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
