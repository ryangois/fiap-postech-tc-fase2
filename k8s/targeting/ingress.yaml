# um ingress por namespace, o nginx junta tudo no mesmo lb
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: targeting-service
  namespace: tm-targeting
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /rules
            pathType: Prefix
            backend:
              service:
                name: targeting-service
                port:
                  number: 8003
